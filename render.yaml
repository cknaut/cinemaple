# Cinemaple – Render Blueprint (free tier)
# See DEPLOYMENT.md and RENDER.md for full steps.

databases:
  - name: cinemaple-db
    plan: free

services:
  - type: web
    name: cinemaple
    runtime: python
    plan: free

    buildCommand: "bash build.sh"
    startCommand: "gunicorn cinemaple.wsgi -c gunicorn_config.py"

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: cinemaple-db
          property: connectionString
      - key: SECRET_KEY_DJANGO
        generateValue: true
      - key: DJANGO_ENV
        value: PRODUCTION
      # Required – add in Render Dashboard (sync: false so Blueprint won’t overwrite):
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: EMAIL_VERIFICATION_SECRET_SALT
        sync: false
      - key: PW_RESET_SECRET_SALT
        sync: false
      - key: REV_USER_ACCESS_SECRET_SALT
        sync: false
      - key: TMDB_API_KEY
        sync: false
      # Optional – Mailchimp mailing list (leave unset to disable):
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_DATA_CENTER
        sync: false
      - key: MAILCHIMP_EMAIL_LIST_ID
        sync: false
      - key: MAILCHIMP_EMAIL_LIST_ID_TEST
        sync: false
      # Optional – SMTP email (leave unset for console output):
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

    domains:
      - www.cinemaple.com
      - cinemaple.com
